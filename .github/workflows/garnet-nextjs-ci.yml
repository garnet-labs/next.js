name: Garnet Next.js CI

on:
  workflow_dispatch:

jobs:
  dep-install:
    name: Dependency Install (Garnet)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Garnet Runtime Visibility
        uses: garnet-org/action@v2
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup corepack
        run: npm i -g corepack@0.31 && corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

